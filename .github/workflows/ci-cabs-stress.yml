name: CI CABS stress

# Repeat a flaky-test-prone pytest target many times on the runners whose BLAS
# we cannot exercise locally (Windows OpenBLAS, macOS Accelerate). Builds
# pyscf the same way as the regular CI jobs, then runs the test in fresh
# processes N times; each iteration is an independent draw of the rounding
# lottery. Optional thread jitter varies BLAS reduction orders across
# iterations.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: 'pytest repetitions per OS'
        default: '20'
      thread_jitter:
        description: 'randomize OMP/BLAS threads per iteration'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-cabs-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install python deps
        run: ./.github/workflows/ci_macos/python_deps.sh
      - name: Build pyscf
        run: ./.github/workflows/ci_macos/build_pyscf.sh
      - name: Stress pyscf/mp/test/test_cabs.py
        run: >-
          ./.github/workflows/ci_cabs_stress/stress_loop.sh
          "${{ inputs.repeats }}"
          ${{ inputs.thread_jitter && '1' || '0' }}
          pyscf/mp/test/test_cabs.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas
      - name: Install build dependencies
        run: python -m pip install build wheel setuptools "cmake<4" ninja
      - name: Build wheel
        run: >-
          ./.github/workflows/ci_windows/build_wheel.ps1
          -RuntimeDllDir "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Stress installed wheel
        run: >-
          ./.github/workflows/ci_cabs_stress/stress_installed_wheel.ps1
          -Repeats ${{ inputs.repeats }}
          -ThreadJitter:${{ inputs.thread_jitter }}
